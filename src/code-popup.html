<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
<style>
  .card { height: 185px; gap: 14px; }

  .dot {
    background: #4ade80;
    box-shadow: 0 0 8px #4ade80;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.35; }
  }

  .code-row { display: flex; gap: 8px; }

  .digit {
    width: 36px; height: 46px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; color: #fff;
    animation: fadeUp 0.35s ease both;
  }

  .digit:nth-child(1) { animation-delay: 0.04s; }
  .digit:nth-child(2) { animation-delay: 0.10s; }
  .digit:nth-child(3) { animation-delay: 0.16s; }
  .digit:nth-child(4) { animation-delay: 0.22s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .progress-wrap { width: 176px; }

  .hint { font-size: 10px; color: rgba(255,255,255,0.2); letter-spacing: 0.05em; }
</style>
</head>
<body>
<div class="card">
  <button class="close-btn" onclick="showConfirm()">×</button>
  <div class="header">
    <div class="dot"></div>
    <span class="label">Memorize</span>
  </div>
  <div class="code-row">
    <div class="digit">–</div>
    <div class="digit">–</div>
    <div class="digit">–</div>
    <div class="digit">–</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-bar" id="bar"></div>
    </div>
  </div>
  <div class="hint">keep it in your head</div>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-title">Pause session?</div>
    <div class="confirm-sub">The current cycle will stop</div>
    <div class="confirm-actions">
      <button onclick="hideConfirm()">Continue</button>
      <button class="danger" onclick="doPause()">Pause</button>
    </div>
  </div>
</div>

<script>
const { ipcRenderer } = require('electron');
const bar = document.getElementById('bar');

function showConfirm() { document.getElementById('confirmOverlay').classList.add('visible'); }
function hideConfirm() { document.getElementById('confirmOverlay').classList.remove('visible'); }
function doPause()     { ipcRenderer.send('pause-session'); }

ipcRenderer.on('show-code', (_, code, durationMs) => {
  document.querySelectorAll('.digit').forEach((el, i) => { el.textContent = code[i]; });

  bar.style.transition = 'none';
  bar.style.width = '100%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `width ${durationMs / 1000}s linear`;
    bar.style.width = '0%';
  }));
});
</script>
</body>
</html>
