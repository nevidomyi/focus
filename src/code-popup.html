<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: 'SF Mono', 'Fira Code', monospace;
    -webkit-app-region: drag;
    user-select: none;
    overflow: hidden;
  }

  .card {
    width: 220px;
    height: 185px;
    background: rgba(10, 10, 16, 0.93);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 16px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 24px 64px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.04);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    animation: slideIn 0.28s cubic-bezier(0.34, 1.5, 0.64, 1);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(14px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }

  .header {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 8px #4ade80;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.35; }
  }

  .label {
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
  }

  .code-row {
    display: flex;
    gap: 8px;
  }

  .digit {
    width: 36px; height: 46px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    animation: fadeUp 0.35s ease both;
  }

  .digit:nth-child(1) { animation-delay: 0.04s; }
  .digit:nth-child(2) { animation-delay: 0.10s; }
  .digit:nth-child(3) { animation-delay: 0.16s; }
  .digit:nth-child(4) { animation-delay: 0.22s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .progress-wrap {
    width: 176px;
  }

  .progress-track {
    height: 3px;
    background: rgba(255,255,255,0.07);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    width: 100%;
    background: #60a5fa;
    border-radius: 2px;
    transform-origin: left;
  }

  .hint {
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="dot"></div>
    <span class="label">Memorize</span>
  </div>
  <div class="code-row" id="codeRow">
    <div class="digit">–</div>
    <div class="digit">–</div>
    <div class="digit">–</div>
    <div class="digit">–</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-bar" id="bar"></div>
    </div>
  </div>
  <div class="hint">keep it in your head</div>
</div>

<script>
const { ipcRenderer } = require('electron');
const bar = document.getElementById('bar');

ipcRenderer.on('show-code', (_, code, durationMs) => {
  const digits = document.querySelectorAll('.digit');
  code.split('').forEach((d, i) => { digits[i].textContent = d; });

  const durationSec = durationMs / 1000;

  bar.style.transition = 'none';
  bar.style.width = '100%';

  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `width ${durationSec}s linear`;
    bar.style.width = '0%';
  }));

});
</script>
</body>
</html>
