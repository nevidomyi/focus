<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
<style>
  .card { height: 175px; gap: 16px; }

  .dot { background: #f87171; box-shadow: 0 0 8px rgba(248,113,113,0.8); }

  .top { display: flex; flex-direction: column; align-items: center; gap: 5px; }

  .message { font-size: 11px; color: rgba(255,255,255,0.3); text-align: center; letter-spacing: 0.03em; }

  .actions {
    display: flex; flex-direction: column;
    gap: 7px; width: 180px;
    -webkit-app-region: no-drag;
  }

  .btn {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.09);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.72);
    font-size: 12px; font-family: inherit;
    cursor: pointer;
    transition: background 0.13s, border-color 0.13s, color 0.13s;
    text-align: left; width: 100%;
  }

  .btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.18); color: #fff; }

  .btn.sleep:hover {
    background: rgba(99,102,241,0.18);
    border-color: rgba(99,102,241,0.45);
    color: rgba(199,200,255,0.9);
  }

  .icon { font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <button class="close-btn" onclick="ipcRenderer.send('pause-session')">×</button>
  <div class="top">
    <div class="header">
      <div class="dot"></div>
      <span class="label">Focus lost</span>
    </div>
    <div class="message">Time's up — what next?</div>
  </div>
  <div class="actions">
    <button class="btn" onclick="newCode()">
      <span class="icon">🔄</span> New combination
    </button>
    <button class="btn sleep" onclick="sleepNow()">
      <span class="icon">😴</span> Sleep &amp; rest
    </button>
  </div>
</div>

<script>
const { ipcRenderer } = require('electron');
function newCode()  { ipcRenderer.send('new-code'); }
function sleepNow() { ipcRenderer.send('sleep-now'); }
</script>
</body>
</html>
