<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
<style>
  .card { height: 190px; gap: 14px; }

  .dot { background: #facc15; box-shadow: 0 0 8px rgba(250,204,21,0.7); }

  .input-row {
    display: flex;
    gap: 8px;
    -webkit-app-region: no-drag;
  }

  .cell {
    width: 36px; height: 46px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; color: #fff;
    transition: border-color 0.12s, background 0.12s;
  }

  .cell.active { border-color: rgba(250,204,21,0.65); background: rgba(250,204,21,0.07); }
  .cell.filled { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.06); }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15%       { transform: translateX(-7px); }
    35%       { transform: translateX(7px); }
    55%       { transform: translateX(-5px); }
    75%       { transform: translateX(5px); }
    90%       { transform: translateX(-2px); }
  }
  .input-row.shake { animation: shake 0.42s ease; }

  .progress-wrap { width: 176px; -webkit-app-region: no-drag; }

  .hint { font-size: 10px; color: rgba(255,255,255,0.22); letter-spacing: 0.05em; }

  input { position: fixed; opacity: 0; pointer-events: none; width: 0; height: 0; }
</style>
</head>
<body>
<div class="card" onclick="focusInput()">
  <button class="close-btn" onclick="event.stopPropagation(); showConfirm()">×</button>
  <div class="header">
    <div class="dot"></div>
    <span class="label">Enter code</span>
  </div>
  <div class="input-row" id="inputRow">
    <div class="cell" id="c0"></div>
    <div class="cell" id="c1"></div>
    <div class="cell" id="c2"></div>
    <div class="cell" id="c3"></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-bar" id="bar"></div>
    </div>
  </div>
  <div class="hint" id="hint">click here, then type</div>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-title">Pause session?</div>
    <div class="confirm-sub">The current cycle will stop</div>
    <div class="confirm-actions">
      <button onclick="hideConfirm()">Continue</button>
      <button class="danger" onclick="doPause()">Pause</button>
    </div>
  </div>
</div>

<input type="text" id="hiddenInput" inputmode="numeric" autocomplete="off">

<script>
const { ipcRenderer } = require('electron');

function showConfirm() { document.getElementById('confirmOverlay').classList.add('visible'); }
function hideConfirm() { document.getElementById('confirmOverlay').classList.remove('visible'); }
function doPause()     { ipcRenderer.send('pause-session'); }

const cells    = [0,1,2,3].map(i => document.getElementById('c' + i));
const bar      = document.getElementById('bar');
const hint     = document.getElementById('hint');
const inputRow = document.getElementById('inputRow');
const hidden   = document.getElementById('hiddenInput');

let DURATION = 30;
let entered = '';
let timerInterval = null;

function focusInput() {
  hidden.focus();
  hint.textContent = 'type the 4-digit code';
}

function updateCells() {
  cells.forEach((c, i) => {
    c.textContent = entered[i] || '';
    c.className = 'cell';
    if (i < entered.length)         c.classList.add('filled');
    else if (i === entered.length)  c.classList.add('active');
  });
}

hidden.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9' && entered.length < 4) {
    entered += e.key;
    updateCells();
    if (entered.length === 4) ipcRenderer.send('check-code', entered);
  } else if (e.key === 'Backspace') {
    entered = entered.slice(0, -1);
    updateCells();
  }
});

ipcRenderer.on('wrong-code', () => {
  inputRow.classList.remove('shake');
  void inputRow.offsetWidth; // force reflow so animation restarts
  inputRow.classList.add('shake');
  entered = '';
  updateCells();
  inputRow.addEventListener('animationend', () => inputRow.classList.remove('shake'), { once: true });
});

ipcRenderer.on('start-timer', (_, durationSec) => {
  if (durationSec) DURATION = durationSec;
  updateCells();

  bar.style.transition = 'none';
  bar.style.width = '100%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `width ${DURATION}s linear`;
    bar.style.width = '0%';
  }));

  let elapsed = 0;
  timerInterval = setInterval(() => {
    if (++elapsed >= DURATION) {
      clearInterval(timerInterval);
      ipcRenderer.send('time-up');
    }
  }, 1000);

  setTimeout(focusInput, 80);
});

updateCells();
</script>
</body>
</html>
