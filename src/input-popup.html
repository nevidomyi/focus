<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: 'SF Mono', 'Fira Code', monospace;
    user-select: none;
    overflow: hidden;
    -webkit-app-region: drag;
  }

  .card {
    width: 220px;
    height: 190px;
    background: rgba(10, 10, 16, 0.93);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 16px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 24px 64px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.04);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    animation: slideIn 0.28s cubic-bezier(0.34, 1.5, 0.64, 1);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(14px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }

  .header {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #facc15;
    box-shadow: 0 0 8px rgba(250,204,21,0.7);
  }

  .label {
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
  }

  /* Digit cells */
  .input-row {
    display: flex;
    gap: 8px;
    -webkit-app-region: no-drag;
  }

  .cell {
    width: 36px; height: 46px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    transition: border-color 0.12s, background 0.12s;
  }

  .cell.active {
    border-color: rgba(250, 204, 21, 0.65);
    background: rgba(250, 204, 21, 0.07);
  }

  .cell.filled {
    border-color: rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.06);
  }

  /* Shake on wrong code — applied to the whole row */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15%       { transform: translateX(-7px); }
    35%       { transform: translateX(7px); }
    55%       { transform: translateX(-5px); }
    75%       { transform: translateX(5px); }
    90%       { transform: translateX(-2px); }
  }

  .input-row.shake {
    animation: shake 0.42s ease;
  }

  /* Progress bar */
  .progress-wrap {
    width: 176px;
    -webkit-app-region: no-drag;
  }

  .progress-track {
    height: 3px;
    background: rgba(255,255,255,0.07);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    width: 100%;
    background: #60a5fa;
    border-radius: 2px;
    transform-origin: left;
  }

  .hint {
    font-size: 10px;
    color: rgba(255,255,255,0.22);
    letter-spacing: 0.05em;
  }

  /* Hidden input that captures keypresses */
  input {
    position: fixed;
    opacity: 0;
    pointer-events: none;
    width: 0; height: 0;
  }
</style>
</head>
<body>
<div class="card" onclick="focusInput()">
  <div class="header">
    <div class="dot"></div>
    <span class="label">Enter code</span>
  </div>
  <div class="input-row" id="inputRow">
    <div class="cell" id="c0"></div>
    <div class="cell" id="c1"></div>
    <div class="cell" id="c2"></div>
    <div class="cell" id="c3"></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-bar" id="bar"></div>
    </div>
  </div>
  <div class="hint" id="hint">click here, then type</div>
</div>

<input type="text" id="hiddenInput" inputmode="numeric" autocomplete="off">

<script>
const { ipcRenderer } = require('electron');

const cells    = [0,1,2,3].map(i => document.getElementById('c' + i));
const bar      = document.getElementById('bar');
const hint     = document.getElementById('hint');
const inputRow = document.getElementById('inputRow');
const hidden   = document.getElementById('hiddenInput');

let entered = '';
let timerInterval = null;
const DURATION = 30; // seconds

function focusInput() {
  hidden.focus();
  hint.textContent = 'type the 4-digit code';
}

function updateCells() {
  cells.forEach((c, i) => {
    c.textContent = entered[i] || '';
    c.className = 'cell';
    if (i < entered.length)    c.classList.add('filled');
    else if (i === entered.length) c.classList.add('active');
  });
}

hidden.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9' && entered.length < 4) {
    entered += e.key;
    updateCells();
    if (entered.length === 4) ipcRenderer.send('check-code', entered);
  } else if (e.key === 'Backspace') {
    entered = entered.slice(0, -1);
    updateCells();
  }
});

ipcRenderer.on('wrong-code', () => {
  inputRow.classList.remove('shake');
  // Force reflow so animation restarts cleanly
  void inputRow.offsetWidth;
  inputRow.classList.add('shake');
  entered = '';
  updateCells();
  inputRow.addEventListener('animationend', () => inputRow.classList.remove('shake'), { once: true });
});

ipcRenderer.on('start-timer', () => {
  let elapsed = 0;
  updateCells();

  // CSS-driven shrink: transition width over DURATION seconds
  bar.style.transition = 'none';
  bar.style.width = '100%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `width ${DURATION}s linear`;
    bar.style.width = '0%';
  }));

  timerInterval = setInterval(() => {
    elapsed++;
    const remaining = DURATION - elapsed;
    if (elapsed >= DURATION) {
      clearInterval(timerInterval);
      ipcRenderer.send('time-up');
    }
  }, 1000);

  // Auto-focus so keystrokes work immediately after user clicks the popup
  setTimeout(focusInput, 80);
});

updateCells();
</script>
</body>
</html>
